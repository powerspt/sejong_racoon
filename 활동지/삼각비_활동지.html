<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>삼각비 활동지</title>
<style>
@page { size: A4 landscape; margin: 0; }
* { margin:0; padding:0; }
html, body { width:297mm; height:210mm; }
body { font-family:'Malgun Gothic', Arial, sans-serif; }
svg { display:block; }
@media screen { body { background:#888; } svg { background:#fff; box-shadow:0 0 8px rgba(0,0,0,.4); margin:10px auto; } }
</style>
</head>
<body>
<svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg">
  <!-- 5mm 모눈 -->
  <defs>
    <pattern id="g5" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#DCE1E6" stroke-width="0.2"/>
    </pattern>
    <pattern id="g10" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="url(#g5)"/>
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#C3CBD3" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="297" height="210" fill="#FFFFFF"/>
  <rect x="5" y="20" width="287" height="165" fill="url(#g10)"/>

  <!-- 제목·지시 -->
  <text x="15" y="12" font-size="6" font-weight="bold" fill="#15232E">삼각비 활동지 — 10cm 막대는 앞으로 얼마, 위로 얼마 가는가</text>
  <text x="15" y="17.5" font-size="3.6" fill="#4A5568">각 선 위에 원점에서 10cm 되는 곳을 자로 표시 → 그 점에서 모눈을 따라 "앞으로 간 거리"와 "올라간 높이"를 읽어 기록표에 적는다. 각도는 종이가, 길이는 자가 책임진다.</text>

  <!-- 패널 1 · 30° (수직에서 30도 눕힘) -->
  <line x1="15" y1="170" x2="15" y2="70" stroke="#8D99A5" stroke-width="0.5" stroke-dasharray="2 1.5"/>
  <line x1="15" y1="170" x2="70" y2="74.74" stroke="#15232E" stroke-width="0.9"/>
  <path d="M 15 158 A 12 12 0 0 1 21 159.6" fill="none" stroke="#E06C2B" stroke-width="0.5"/>
  <circle cx="15" cy="170" r="1.4" fill="#E06C2B"/>
  <text x="11" y="175.5" font-size="3.6" fill="#5A6675">원점</text>
  <text x="23" y="156" font-size="4.6" font-weight="bold" fill="#B3482A">30&#176;</text>
  <text x="56" y="71" font-size="3.4" fill="#5A6675">(선 길이 11cm &#8212; 10cm 지점을 자로 표시)</text>

  <!-- 패널 2 · 45° -->
  <line x1="90" y1="170" x2="90" y2="70" stroke="#8D99A5" stroke-width="0.5" stroke-dasharray="2 1.5"/>
  <line x1="90" y1="170" x2="167.78" y2="92.22" stroke="#15232E" stroke-width="0.9"/>
  <path d="M 90 158 A 12 12 0 0 1 98.5 161.5" fill="none" stroke="#E06C2B" stroke-width="0.5"/>
  <circle cx="90" cy="170" r="1.4" fill="#E06C2B"/>
  <text x="86" y="175.5" font-size="3.6" fill="#5A6675">원점</text>
  <text x="102" y="154" font-size="4.6" font-weight="bold" fill="#B3482A">45&#176;</text>
  <text x="124" y="118" font-size="3.4" fill="#5A6675">모눈 대각선과 정확히 겹친다 &#8212; 가로 1 : 세로 1 이 곧 45&#176;</text>

  <!-- 패널 3 · 60° -->
  <line x1="185" y1="170" x2="185" y2="70" stroke="#8D99A5" stroke-width="0.5" stroke-dasharray="2 1.5"/>
  <line x1="185" y1="170" x2="280.26" y2="115" stroke="#15232E" stroke-width="0.9"/>
  <path d="M 185 158 A 12 12 0 0 1 195.4 163.9" fill="none" stroke="#E06C2B" stroke-width="0.5"/>
  <circle cx="185" cy="170" r="1.4" fill="#E06C2B"/>
  <text x="181" y="175.5" font-size="3.6" fill="#5A6675">원점</text>
  <text x="197" y="158.5" font-size="4.6" font-weight="bold" fill="#B3482A">60&#176;</text>

  <!-- 읽는 법 안내 (패널 1 안에 작은 예시) -->
  <text x="15" y="63" font-size="3.4" fill="#2E7FB8">읽는 법: 표시한 점에서 모눈을 따라 수직으로 내려 "앞", 수평으로 꺾어 "높이"</text>

  <!-- 인쇄 검증 자 10cm -->
  <line x1="15" y1="196" x2="115" y2="196" stroke="#15232E" stroke-width="0.8"/>
  <line x1="15" y1="193" x2="15" y2="199" stroke="#15232E" stroke-width="0.8"/>
  <line x1="115" y1="193" x2="115" y2="199" stroke="#15232E" stroke-width="0.8"/>
  <line x1="65" y1="194" x2="65" y2="198" stroke="#15232E" stroke-width="0.5"/>
  <text x="122" y="197.5" font-size="3.8" fill="#15232E">인쇄 확인용 10cm &#8212; 자로 재서 10.0cm 가 아니면 "실제 크기(100%)" 로 다시 인쇄</text>

  <!-- 기록표 -->
  <g font-size="3.4" fill="#15232E">
    <rect x="193" y="22" width="99" height="34" fill="#FFFFFF" stroke="#8D99A5" stroke-width="0.4"/>
    <line x1="193" y1="31" x2="292" y2="31" stroke="#8D99A5" stroke-width="0.4"/>
    <line x1="193" y1="39.3" x2="292" y2="39.3" stroke="#C3CBD3" stroke-width="0.3"/>
    <line x1="193" y1="47.7" x2="292" y2="47.7" stroke="#C3CBD3" stroke-width="0.3"/>
    <line x1="205" y1="22" x2="205" y2="56" stroke="#8D99A5" stroke-width="0.4"/>
    <line x1="229" y1="22" x2="229" y2="56" stroke="#C3CBD3" stroke-width="0.3"/>
    <line x1="249" y1="22" x2="249" y2="56" stroke="#8D99A5" stroke-width="0.4"/>
    <line x1="273" y1="22" x2="273" y2="56" stroke="#C3CBD3" stroke-width="0.3"/>
    <text x="195" y="28.2" font-weight="bold">각도</text>
    <text x="206.5" y="26.6" font-weight="bold" font-size="3.0">앞으로 간 거리</text>
    <text x="206.5" y="30.2" font-size="2.8" fill="#4A5568">(잰 값)</text>
    <text x="231" y="28.2" font-weight="bold" font-size="3.1">10&#215;sin</text>
    <text x="250.5" y="26.6" font-weight="bold" font-size="3.0">올라간 높이</text>
    <text x="250.5" y="30.2" font-size="2.8" fill="#4A5568">(잰 값)</text>
    <text x="275" y="28.2" font-weight="bold" font-size="3.1">10&#215;cos</text>
    <text x="195" y="36.6">30&#176;</text><text x="231" y="36.6">5.00</text><text x="275" y="36.6">8.66</text>
    <text x="195" y="45">45&#176;</text><text x="231" y="45">7.07</text><text x="275" y="45">7.07</text>
    <text x="195" y="53.4">60&#176;</text><text x="231" y="53.4">8.66</text><text x="275" y="53.4">5.00</text>
  </g>
</svg>
</body>
</html>
